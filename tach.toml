# Module boundaries, enforced by `tach check` in CI (.github/workflows/ci.yml,
# the Lint & Format job) and by check.sh locally.
#
# The layering runs one way, core at the bottom:
#
#   core  <-  ui  <-  ui.screens  <-  main
#   core  <-  clean / manage  <-  ui.screens, main
#
# core depends on nothing. ui is a terminal *widget toolkit* (Navigator, the
# selectors, raw mode, mouse) -- infrastructure like curses, not the top of the
# stack -- so it also sits low and may only reach for core. Feature packages
# (clean, manage) hold logic and their own non-interactive entry points.
# ui.screens is where the selector-driven flows live, and is the one place
# allowed to compose the toolkit with a feature package.
#
# The graph is clean; keep it that way. When a check starts failing, fix the
# import rather than widening depends_on, and never run `tach sync` -- it writes
# whatever the code currently does into the config, which is how a `core -> ui`
# edge got legitimized once before.


interfaces = []
exclude = [
    "**/*__pycache__",
    "**/*egg-info",
    "**/docs",
    "**/tests",
    "**/venv",
]
source_roots = [
    ".",
]
root_module = "ignore"

[[modules]]
path = "src.core"
depends_on = []

[[modules]]
path = "src.ui"
depends_on = ["src.core"]

# Interactive screens compose the toolkit above with the feature modules. They
# are a nested module precisely so that this wider allowance does NOT extend to
# src.ui itself: navigator.py stays a toolkit that cannot import a feature.
[[modules]]
path = "src.ui.screens"
depends_on = ["src.core", "src.ui", "src.analyze", "src.uninstall"]

# The five main-menu features, one module each -- clean is a package only
# because it cleans four different things. The split that decides where a
# command lives is what it acts on: these five work on the user's system, while
# manage/ works on the topo installation itself, which is why doctor lives there
# rather than beside them. core/ is the infrastructure all of them build on, so
# it holds none of them.
#
# Uninstall and Analyze are the two that drive a full-screen selector, so each
# is a pair: the logic here, the screen under ui/screens/.
[[modules]]
path = "src.clean"
depends_on = ["src.core"]

[[modules]]
path = "src.optimize"
depends_on = ["src.core"]

[[modules]]
path = "src.uninstall"
depends_on = ["src.core"]

[[modules]]
path = "src.analyze"
depends_on = ["src.core"]

[[modules]]
path = "src.status"
depends_on = ["src.core"]

[[modules]]
path = "src.manage"
depends_on = ["src.core"]

[[modules]]
path = "src.main"
depends_on = [
    "src.core",
    "src.ui",
    "src.ui.screens",
    "src.clean",
    "src.optimize",
    "src.status",
    "src.manage",
]
