# Module boundaries, enforced by `tach check` (also run from check.sh).
#
# The layering runs one way, core at the bottom:
#
#   core  <-  ui  <-  ui.screens  <-  main
#   core  <-  clean / manage  <-  ui.screens, main
#
# core depends on nothing. ui is a terminal *widget toolkit* (Navigator, the
# selectors, raw mode, mouse) -- infrastructure like curses, not the top of the
# stack -- so it also sits low and may only reach for core. Feature packages
# (clean, manage) hold logic and their own non-interactive entry points.
# ui.screens is where the selector-driven flows live, and is the one place
# allowed to compose the toolkit with a feature package.
#
# KNOWN FAILING: nothing -- `tach check` is clean. Keep it that way: if a check
# starts failing, fix the import rather than widening depends_on, and never run
# `tach sync`, which writes whatever the code currently does into the config and
# would silently legitimize the next `core -> ui` edge the way it did once
# before.
#
# tach is not wired into CI yet. Now that the graph is clean it can be.


interfaces = []
exclude = [
    "**/*__pycache__",
    "**/*egg-info",
    "**/docs",
    "**/tests",
    "**/venv",
]
source_roots = [
    ".",
]
root_module = "ignore"

[[modules]]
path = "src.core"
depends_on = []

[[modules]]
path = "src.ui"
depends_on = ["src.core"]

# Interactive screens compose the toolkit above with the feature packages. They
# are a nested module precisely so that this wider allowance does NOT extend to
# src.ui itself: navigator.py stays a toolkit that cannot import a feature.
[[modules]]
path = "src.ui.screens"
depends_on = ["src.core", "src.ui", "src.clean"]

[[modules]]
path = "src.clean"
depends_on = ["src.core"]

[[modules]]
path = "src.manage"
depends_on = ["src.core"]

[[modules]]
path = "src.main"
depends_on = ["src.core", "src.ui", "src.ui.screens", "src.clean", "src.manage"]
