[tool.vulture]
# These are reached in ways vulture cannot see, so it would report every one of
# them as dead. The run_* tasks are pulled from OptimizationRegistry rather than
# called by name; exc_* are the __exit__ protocol parameters, which have to be
# accepted and are then unused by design.
#
# Listed one by one rather than as run_*/exc_* globs: a pattern would also cover
# a future run_ task that really had gone dead.
ignore_names = [
    "run_vacuum_all",
    "run_fstrim",
    "run_fccache",
    "run_tmpfiles_cleanup",
    "run_ldconfig",
    "run_locale_gen",
    "run_man_db_refresh",
    "run_autostart_cleanup",
    "run_systemd_user_service_cleanup",
    "run_user_systemd_reset_failed",
    "run_system_systemd_reset_failed",
    "run_swap_management",
    "run_journal_optimization",
    "run_coredump_cleanup",
    "run_broken_symlink_cleanup",
    "run_desktop_database_refresh",
    "run_mime_database_refresh",
    "run_glib_schema_compile",
    "run_icon_cache_refresh",
    "run_locate_db_refresh",
    "run_flatpak_repair",
    "run_package_repo_refresh",
    "exc_tb",
    "exc_type",
    "exc_val",
]

[tool.ruff]
# 指定代码目标版本
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 启用的规则集
# E: pycodestyle
# F: Pyflakes
# I: isort (自动整理导入顺序)
# UP: pyupgrade (升级旧语法)
# B: flake8-bugbear (发现潜在bug)
# SIM: flake8-simplify (简化代码)
# ISC: flake8-implicit-str-concat (捕获缺逗号导致的隐式字符串拼接)
select = ["E", "F", "I", "UP", "B", "SIM", "W", "ISC"]
ignore = ["E501"]

# 自动修复
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# 使用双引号，类似于 Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["src"]
# Interactive terminal rendering and raw keyboard/mouse handling require a
# pseudo-terminal integration suite. Keep that work explicitly out of the
# current unit-test coverage target instead of scattering no-cover markers
# throughout UI code. Remove this omission when PTY-based UI tests are added.
omit = [
    "src/ui/**",
    "src/__init__.py",
    "src/**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 0
# Exclusions must describe code that cannot add meaningful behavioral coverage,
# not merely code that is inconvenient to test. Business branches, error
# handling, filesystem mutations, and command construction remain measurable.
exclude_also = [
    # Explicit, reviewable escape hatch for platform-only or process-replacing
    # paths. Every use should include a nearby comment explaining why.
    "# pragma: no cover",
    # Static typing blocks never execute at runtime.
    "if TYPE_CHECKING:",
    # Abstract/protocol declarations define contracts rather than behavior.
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    # Standard defensive assertions that communicate an unreachable state.
    "if __debug__:",
    # Module entry points only delegate to the already-tested application API.
    "if __name__ == .__main__.:",
]
