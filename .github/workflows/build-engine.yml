name: Build & Package

on:
  pull_request:
    branches: ["main"]
    paths:
      - "install.sh"
      - "packaging/**"
      - "src/manage/**"
      - "src/core/install_source.py"
      - "topo-core/**"
      - "topo"
      - "VERSION"
      - ".github/workflows/build-engine.yml"
      - ".github/workflows/release.yml"
  push:
    branches: ["main"]
    paths:
      - "install.sh"
      - "packaging/**"
      - "src/manage/**"
      - "src/core/install_source.py"
      - "topo-core/**"
      - "topo"
      - "VERSION"
      - ".github/workflows/build-engine.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-script-install:
    name: Smoke Test install.sh on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Script Prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gnupg
          fi
          if ! python3 -c "import packaging" >/dev/null 2>&1; then
            python3 -m pip install packaging
          fi

      - name: Install and Verify User Copy
        shell: bash
        env:
          HOME: ${{ runner.temp }}/topo-home
          # Deliberately not $HOME/.local/bin: with HOME already redirected, the
          # default would be indistinguishable from no override at all, and the
          # override is the path with no other coverage -- `topo remove` used to
          # ignore TOPO_LINK_DIR entirely and leave a dangling launcher on PATH.
          TOPO_LINK_DIR: ${{ runner.temp }}/topo-home/opt/bin
          PATH: ${{ runner.temp }}/topo-home/opt/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          mkdir -p "$HOME"

          bash install.sh --minimal
          version="$(tr -d '[:space:]' < "$HOME/.topo/VERSION")"
          test -x "$HOME/.topo/topo"
          test -L "$TOPO_LINK_DIR/topo"
          test "$(readlink -f "$TOPO_LINK_DIR/topo")" = "$(readlink -f "$HOME/.topo/topo")"
          test "$($TOPO_LINK_DIR/topo --version)" = "topo ${version}"

          repeat_output="$(bash install.sh --version "v${version}")"
          printf '%s\n' "$repeat_output"
          grep -F "Topo v${version} is already installed; skipping download." <<<"$repeat_output"

          # Uninstall last: the script install had no removal smoke at all, so
          # nothing verified that what install.sh creates is what topo remove
          # deletes. Keep the output before judging the exit code (see I1).
          remove_output="$("$TOPO_LINK_DIR/topo" remove --yes)" && remove_status=0 || remove_status=$?
          printf '%s\n' "$remove_output"
          test "$remove_status" -eq 0
          test ! -e "$TOPO_LINK_DIR/topo" && test ! -L "$TOPO_LINK_DIR/topo"
          test ! -e "$HOME/.topo"

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Build Musl Static Binary with Rust Cross
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --manifest-path topo-core/Cargo.toml"

      - name: Verify ELF Static Binary Properties
        run: |
          BIN="topo-core/target/${{ matrix.target }}/release/topo-core"
          echo "=== Verifying Binary Properties for ${{ matrix.target }} ==="
          file "$BIN"

          # Verify ELF Machine Architecture match
          case "${{ matrix.arch }}" in
            x86_64)
              readelf -h "$BIN" | grep -q 'Machine:.*X86-64'
              ;;
            aarch64)
              readelf -h "$BIN" | grep -q 'Machine:.*AArch64'
              ;;
          esac

          # Check 1: Must NOT have PT_INTERP dynamic linker requested
          if readelf -l "$BIN" | grep -i INTERP; then
            echo "❌ ERROR: Binary has PT_INTERP interpreter! It is NOT statically linked."
            exit 1
          fi

          # Check 2: Must NOT have DT_NEEDED dynamic library dependencies
          if readelf -d "$BIN" | grep -i NEEDED; then
            echo "❌ ERROR: Binary has DT_NEEDED dynamic dependencies! It is NOT statically linked."
            exit 1
          fi

          echo "✅ VERIFIED: Binary $BIN is a 100% pure static ELF executable!"
          cp "$BIN" "topo-core-${{ matrix.arch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: topo-core-${{ matrix.arch }}
          path: topo-core-${{ matrix.arch }}

  package:
    name: Build Debian/RPM Packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build Debian and RPM Packages
        run: |
          packaging/build-linux-packages.sh \
            --x86_64-engine artifacts/topo-core-x86_64/topo-core-x86_64 \
            --aarch64-engine artifacts/topo-core-aarch64/topo-core-aarch64 \
            --output-dir dist/packages

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages/*

  smoke-ubuntu:
    name: Smoke Test DEB on Ubuntu
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages

      - name: Install and Verify DEB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          mkdir -p "$HOME/.local/bin"
          rm -f "$HOME/.local/bin/topo"
          sudo env SUDO_USER="$USER" SUDO_UID="$(id -u)" apt install -y ./dist/packages/topo_*_amd64.deb

          /usr/bin/topo --version
          test "$(cat /usr/lib/topo/.topo-install-source)" = "package"

          hash -p "$HOME/.local/bin/topo" topo
          if [ -x "$HOME/.local/bin/topo" ]; then
            grep -F "Managed by topo package compatibility launcher" "$HOME/.local/bin/topo"
          else
            hash -r
          fi
          topo --version

          # topo now reports failures through its exit code, so capture the
          # status instead of letting `set -e` abort on the assignment -- the
          # output has to be printed before the check or the log is empty on the
          # very run that failed.
          update_output="$(topo update)" && update_status=0 || update_status=$?
          printf '%s\n' "$update_output"
          test "$update_status" -eq 0
          grep -F "Checking for updates" <<<"$update_output"
          ! grep -F "sudo apt upgrade topo" <<<"$update_output"
          ! grep -F "sudo dnf upgrade topo" <<<"$update_output"

          remove_output="$(topo remove --yes)" && remove_status=0 || remove_status=$?
          printf '%s\n' "$remove_output"
          test "$remove_status" -eq 0
          grep -F "apt remove -y topo" <<<"$remove_output"
          ! grep -F "dnf remove -y topo" <<<"$remove_output"
          if dpkg-query -W -f='${Status}' topo 2>/dev/null | grep -F "install ok installed"; then
            echo "topo package is still installed"
            exit 1
          fi

  smoke-fedora:
    name: Smoke Test RPM on Fedora
    needs: package
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages

      - name: Install and Verify RPM
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y ./dist/packages/topo-*-1.x86_64.rpm

          topo --version
          test "$(cat /usr/lib/topo/.topo-install-source)" = "package"

          update_output="$(topo update)" && update_status=0 || update_status=$?
          printf '%s\n' "$update_output"
          test "$update_status" -eq 0
          grep -F "Checking for updates" <<<"$update_output"
          ! grep -F "sudo apt upgrade topo" <<<"$update_output"
          ! grep -F "sudo dnf upgrade topo" <<<"$update_output"

          remove_output="$(topo remove --yes)" && remove_status=0 || remove_status=$?
          printf '%s\n' "$remove_output"
          test "$remove_status" -eq 0
          grep -F "dnf remove -y topo" <<<"$remove_output"
          ! grep -F "apt remove -y topo" <<<"$remove_output"
          ! rpm -q topo
