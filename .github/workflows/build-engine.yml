name: Build & Package

on:
  pull_request:
    branches: ["main"]
    paths:
      - "install.sh"
      - "packaging/**"
      - "src/manage/**"
      - "src/core/install_source.py"
      - "src/core/paths.py"
      # src/core/bin/** so that a commit which touches only the bundled engines
      # still has to face the stamp gate in the build job below.
      - "src/core/bin/**"
      - "topo-core/**"
      - "topo"
      - "VERSION"
      - ".github/workflows/build-engine.yml"
      - ".github/workflows/release.yml"
  push:
    branches: ["main"]
    paths:
      - "install.sh"
      - "packaging/**"
      - "src/manage/**"
      - "src/core/install_source.py"
      - "src/core/paths.py"
      - "src/core/bin/**"
      - "topo-core/**"
      - "topo"
      - "VERSION"
      - ".github/workflows/build-engine.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-script-install:
    name: Smoke Test install.sh on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Script Prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gnupg
          fi
          if ! python3 -c "import packaging" >/dev/null 2>&1; then
            python3 -m pip install packaging
          fi

      - name: Install and Verify User Copy
        shell: bash
        env:
          HOME: ${{ runner.temp }}/topo-home
          # Deliberately not $HOME/.local/bin: with HOME already redirected, the
          # default would be indistinguishable from no override at all, and the
          # override is the path with no other coverage -- `topo remove` used to
          # ignore TOPO_LINK_DIR entirely and leave a dangling launcher on PATH.
          TOPO_LINK_DIR: ${{ runner.temp }}/topo-home/opt/bin
          PATH: ${{ runner.temp }}/topo-home/opt/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          mkdir -p "$HOME"

          bash install.sh --minimal
          version="$(tr -d '[:space:]' < "$HOME/.topo/VERSION")"
          test -x "$HOME/.topo/topo"
          test -L "$TOPO_LINK_DIR/topo"
          test "$(readlink -f "$TOPO_LINK_DIR/topo")" = "$(readlink -f "$HOME/.topo/topo")"
          test "$("$TOPO_LINK_DIR/topo" --version)" = "topo ${version}"

          repeat_output="$(bash install.sh --version "v${version}")"
          printf '%s\n' "$repeat_output"
          grep -F "Topo v${version} is already installed; skipping download." <<<"$repeat_output"

          # Uninstall last: the script install had no removal smoke at all, so
          # nothing verified that what install.sh creates is what topo remove
          # deletes. Deliberately the checkout's remover and not the installed
          # one -- install.sh can only unpack a signed *release*, so
          # "$TOPO_LINK_DIR/topo" is whatever the last release shipped, and the
          # TOPO_LINK_DIR-aware launcher sweep being asserted here lives in this
          # commit. Keep the output before judging the exit code (see I1).
          remove_output="$(./topo remove --yes)" && remove_status=0 || remove_status=$?
          printf '%s\n' "$remove_output"
          test "$remove_status" -eq 0
          # -e alone would pass on a dangling symlink, which is the exact bug, so
          # -L asks the other half. Two commands and not `a && b`: errexit exempts
          # every command in an && list but the last, so joining them would leave
          # a leftover *regular* file passing the pair (see D16).
          test ! -e "$TOPO_LINK_DIR/topo"
          test ! -L "$TOPO_LINK_DIR/topo"
          test ! -e "$HOME/.topo"

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Build Musl Static Binary with Rust Cross
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --manifest-path topo-core/Cargo.toml"

      - name: Verify ELF Static Binary Properties
        run: |
          BIN="topo-core/target/${{ matrix.target }}/release/topo-core"
          echo "=== Verifying Binary Properties for ${{ matrix.target }} ==="
          file "$BIN"
          # The architecture and the two "no dynamic linking" assertions come from
          # the script that owns them, so this job cannot drift from the check the
          # bundled engines face -- it used to keep its own copy of the ELF probes,
          # without the LC_ALL=C that a translated field name needs.
          packaging/build-engine.sh --check-elf "$BIN" "${{ matrix.arch }}"
          cp "$BIN" "topo-core-${{ matrix.arch }}"

      # The engines committed under src/core/bin/ are what a git or --minimal
      # install runs, and nothing here used to compare them with topo-core/.
      # A byte compare against this fresh build cannot be the check: a musl
      # release build bakes in the builder's cargo registry path, so the runner
      # produces different bytes than the developer for the very same commit.
      # Hence two questions instead: the stamp answers "were the committed bytes
      # built from this source", and the x86_64 leg -- the only architecture this
      # runner can execute -- also asks the committed engine and the fresh one
      # the same things about a fixture tree.
      - name: Verify Bundled Engines Against the Stamp
        run: packaging/build-engine.sh --verify

      - name: Compare Bundled Engine With This Build
        if: matrix.arch == 'x86_64'
        run: packaging/build-engine.sh --compare "topo-core-x86_64" x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: topo-core-${{ matrix.arch }}
          path: topo-core-${{ matrix.arch }}

  package:
    name: Build Debian/RPM Packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build Debian and RPM Packages
        run: |
          packaging/build-linux-packages.sh \
            --x86_64-engine artifacts/topo-core-x86_64/topo-core-x86_64 \
            --aarch64-engine artifacts/topo-core-aarch64/topo-core-aarch64 \
            --output-dir dist/packages

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages/*

  smoke-ubuntu:
    name: Smoke Test DEB on Ubuntu
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages

      - name: Install and Verify DEB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt install -y ./dist/packages/topo_*_amd64.deb

          # A "must not appear" check cannot be written `! grep ...`: errexit
          # exempts a negated command, so those lines passed even with the
          # forbidden string right there in the output (D16). The failing branch
          # has to be an explicit exit.
          must_not_contain() {
            if grep -F "$1" <<<"$2"; then
              echo "::error::output must not contain: $1"
              exit 1
            fi
          }

          /usr/bin/topo --version
          test "$(cat /usr/lib/topo/.topo-install-source)" = "package"

          # The one thing left to check about the shell's view of the command:
          # `hash -r` is what topo tells users to run, and after it `topo` has to
          # be the package's own /usr/bin/topo.
          hash -r
          test "$(command -v topo)" = /usr/bin/topo
          topo --version

          # topo now reports failures through its exit code, so capture the
          # status instead of letting `set -e` abort on the assignment -- the
          # output has to be printed before the check or the log is empty on the
          # very run that failed.
          update_output="$(topo update)" && update_status=0 || update_status=$?
          printf '%s\n' "$update_output"
          test "$update_status" -eq 0
          grep -F "Checking for updates" <<<"$update_output"
          must_not_contain "sudo apt upgrade topo" "$update_output"
          must_not_contain "sudo dnf upgrade topo" "$update_output"

          remove_output="$(topo remove --yes)" && remove_status=0 || remove_status=$?
          printf '%s\n' "$remove_output"
          test "$remove_status" -eq 0
          grep -F "apt remove -y topo" <<<"$remove_output"
          must_not_contain "dnf remove -y topo" "$remove_output"
          if dpkg-query -W -f='${Status}' topo 2>/dev/null | grep -F "install ok installed"; then
            echo "topo package is still installed"
            exit 1
          fi

  smoke-fedora:
    name: Smoke Test RPM on Fedora
    needs: package
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages

      - name: Install and Verify RPM
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y ./dist/packages/topo-*-1.x86_64.rpm

          # See the deb leg: `! grep ...` is exempt from errexit and asserted
          # nothing (D16).
          must_not_contain() {
            if grep -F "$1" <<<"$2"; then
              echo "::error::output must not contain: $1"
              exit 1
            fi
          }

          topo --version
          test "$(cat /usr/lib/topo/.topo-install-source)" = "package"

          update_output="$(topo update)" && update_status=0 || update_status=$?
          printf '%s\n' "$update_output"
          test "$update_status" -eq 0
          grep -F "Checking for updates" <<<"$update_output"
          must_not_contain "sudo apt upgrade topo" "$update_output"
          must_not_contain "sudo dnf upgrade topo" "$update_output"

          remove_output="$(topo remove --yes)" && remove_status=0 || remove_status=$?
          printf '%s\n' "$remove_output"
          test "$remove_status" -eq 0
          grep -F "dnf remove -y topo" <<<"$remove_output"
          must_not_contain "apt remove -y topo" "$remove_output"
          # The deb leg's dpkg-query counterpart, in the shape errexit honours
          # wherever it sits in the script rather than only as the last line.
          if rpm -q topo >/dev/null 2>&1; then
            echo "topo package is still installed"
            exit 1
          fi
