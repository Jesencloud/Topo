name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Linter
        run: pip install ruff mypy packaging vulture tach

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run Ruff Check (Python)
        run: ruff check src tests

      - name: Run Ruff Format (Python)
        run: ruff format --check src tests

      # --check-untyped-defs matches check.sh. Without it mypy skips the bodies
      # of unannotated functions, which would make CI strictly weaker than the
      # local gate: a type error in such a body fails ./check.sh and passes here.
      - name: Run Mypy (Python)
        run: mypy --check-untyped-defs src/

      # Enforces the layering declared in tach.toml: core depends on nothing,
      # ui is a widget toolkit that may only reach for core, and ui.screens is
      # the one place allowed to compose the toolkit with a feature package.
      # Never fix a failure here with `tach sync` -- that writes whatever the
      # code currently does into depends_on and turns the check off.
      - name: Run Tach Module Boundary Check (Python)
        run: tach check

      # The ignore list lives in pyproject.toml under [tool.vulture]; vulture
      # picks it up from the working directory, so no file argument is needed.
      - name: Run Vulture Dead Code Check (Python)
        run: vulture src/

      - name: Run Cargo Clippy (Rust)
        working-directory: topo-core
        run: cargo clippy -- -D warnings

      - name: Run Cargo Fmt (Rust)
        working-directory: topo-core
        run: cargo fmt --check

      - name: Run ShellCheck
        run: find . -type f -name '*.sh' -exec shellcheck {} +

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Test Tools
        run: pip install pytest packaging

      # -p no:tach matches check.sh. The tach package registers a pytest plugin
      # under that name, so a run with tach installed collects differently from
      # one without. This job does not install tach today, but blocking it here
      # keeps that true no matter what lands in the install line later.
      - name: Run Pytest (Python)
        run: pytest -q -p no:tach

  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Test (Rust)
        working-directory: topo-core
        run: cargo test
