name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # topo does not ship prereleases, and a prerelease .deb could not be upgraded
  # away from if it did: dpkg reads everything after the *last* hyphen as the
  # Debian revision, so `--iteration 1` turns v1.2.3-rc.1 into Version
  # 1.2.3-rc.1-1, which outranks the 1.2.3-1 that follows it -- the rc-to-release
  # `apt install` is then a refused downgrade, while topo's own comparison
  # (packaging.version.Version in src/manage/update.py) orders the rc *below* the
  # release. The two orderings disagree, so a prerelease tag gets a source-only
  # release: install.sh and topo-src.tar.gz still ship, no package that could pin
  # a machine to an rc is ever built.
  #
  # Classified once here because a job-level `if:` cannot read the `env` context,
  # and a second copy of this expression next to the `prerelease:` flag below is
  # exactly what would drift.
  tag-kind:
    name: Classify Tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Classify Tag
        id: classify
        env:
          IS_PRERELEASE: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-alpha.') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "${REF_NAME}: prerelease=${IS_PRERELEASE}"

  smoke-script-install:
    name: Smoke Test install.sh on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Script Prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gnupg
          fi
          if ! python3 -c "import packaging" >/dev/null 2>&1; then
            python3 -m pip install packaging
          fi

      - name: Install and Verify User Copy
        shell: bash
        env:
          HOME: ${{ runner.temp }}/topo-home
          TOPO_LINK_DIR: ${{ runner.temp }}/topo-home/.local/bin
          PATH: ${{ runner.temp }}/topo-home/.local/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          mkdir -p "$HOME"

          bash install.sh --minimal
          version="$(tr -d '[:space:]' < "$HOME/.topo/VERSION")"
          test -x "$HOME/.topo/topo"
          test -L "$TOPO_LINK_DIR/topo"
          test "$(readlink -f "$TOPO_LINK_DIR/topo")" = "$(readlink -f "$HOME/.topo/topo")"
          test "$("$TOPO_LINK_DIR/topo" --version)" = "topo ${version}"

          repeat_output="$(bash install.sh --version "v${version}")"
          printf '%s\n' "$repeat_output"
          grep -F "Topo v${version} is already installed; skipping download." <<<"$repeat_output"

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Build Musl Static Binary with Rust Cross
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --manifest-path topo-core/Cargo.toml"

      - name: Verify ELF Static Binary Properties
        run: |
          BIN="topo-core/target/${{ matrix.target }}/release/topo-core"
          echo "=== Verifying Binary Properties for ${{ matrix.target }} ==="
          file "$BIN"
          # One owner for the three assertions -- see the same step in
          # build-engine.yml. These bytes become the published release asset, so
          # the check that they are musl-static matters most here.
          packaging/build-engine.sh --check-elf "$BIN" "${{ matrix.arch }}"
          cp "$BIN" "topo-core-${{ matrix.arch }}"

      # Same gate as build-engine.yml, for the reason that only matters here: the
      # source tarball this workflow publishes carries src/core/bin/ verbatim, so
      # a tag must not be able to ship engines that no longer match topo-core/.
      - name: Verify Bundled Engines Against the Stamp
        run: packaging/build-engine.sh --verify

      - name: Compare Bundled Engine With This Build
        if: matrix.arch == 'x86_64'
        run: packaging/build-engine.sh --compare "topo-core-x86_64" x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: topo-core-${{ matrix.arch }}
          path: topo-core-${{ matrix.arch }}

  package:
    name: Build Debian/RPM Packages
    needs: [build, tag-kind]
    # See tag-kind. Skipping this also skips smoke-ubuntu, smoke-fedora and
    # release-distro-smoke, which need it -- a skipped dependency skips its
    # dependents, so those three need no condition of their own.
    if: needs.tag-kind.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build Debian and RPM Packages
        run: |
          packaging/build-linux-packages.sh \
            --x86_64-engine artifacts/topo-core-x86_64/topo-core-x86_64 \
            --aarch64-engine artifacts/topo-core-aarch64/topo-core-aarch64 \
            --output-dir dist/packages

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages/*

  smoke-ubuntu:
    name: Smoke Test DEB on Ubuntu
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages

      - name: Install and Verify DEB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt install -y ./dist/packages/topo_*_amd64.deb

          # A "must not appear" check cannot be written `! grep ...`: errexit
          # exempts a negated command, so those lines passed even with the
          # forbidden string right there in the output (D16). The failing branch
          # has to be an explicit exit.
          must_not_contain() {
            if grep -F "$1" <<<"$2"; then
              echo "::error::output must not contain: $1"
              exit 1
            fi
          }

          /usr/bin/topo --version
          test "$(cat /usr/lib/topo/.topo-install-source)" = "package"

          # The one thing left to check about the shell's view of the command:
          # `hash -r` is what topo tells users to run, and after it `topo` has to
          # be the package's own /usr/bin/topo.
          hash -r
          test "$(command -v topo)" = /usr/bin/topo
          topo --version

          # topo now reports failures through its exit code, so capture the
          # status instead of letting `set -e` abort on the assignment -- the
          # output has to be printed before the check or the log is empty on the
          # very run that failed.
          update_output="$(topo update)" && update_status=0 || update_status=$?
          printf '%s\n' "$update_output"
          test "$update_status" -eq 0
          grep -F "Checking for updates" <<<"$update_output"
          must_not_contain "sudo apt upgrade topo" "$update_output"
          must_not_contain "sudo dnf upgrade topo" "$update_output"

          remove_output="$(topo remove --yes)" && remove_status=0 || remove_status=$?
          printf '%s\n' "$remove_output"
          test "$remove_status" -eq 0
          grep -F "apt remove -y topo" <<<"$remove_output"
          must_not_contain "dnf remove -y topo" "$remove_output"
          if dpkg-query -W -f='${Status}' topo 2>/dev/null | grep -F "install ok installed"; then
            echo "topo package is still installed"
            exit 1
          fi

  smoke-fedora:
    name: Smoke Test RPM on Fedora
    needs: package
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages

      - name: Install and Verify RPM
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y ./dist/packages/topo-*-1.x86_64.rpm

          # See the deb leg: `! grep ...` is exempt from errexit and asserted
          # nothing (D16).
          must_not_contain() {
            if grep -F "$1" <<<"$2"; then
              echo "::error::output must not contain: $1"
              exit 1
            fi
          }

          topo --version
          test "$(cat /usr/lib/topo/.topo-install-source)" = "package"

          update_output="$(topo update)" && update_status=0 || update_status=$?
          printf '%s\n' "$update_output"
          test "$update_status" -eq 0
          grep -F "Checking for updates" <<<"$update_output"
          must_not_contain "sudo apt upgrade topo" "$update_output"
          must_not_contain "sudo dnf upgrade topo" "$update_output"

          remove_output="$(topo remove --yes)" && remove_status=0 || remove_status=$?
          printf '%s\n' "$remove_output"
          test "$remove_status" -eq 0
          grep -F "dnf remove -y topo" <<<"$remove_output"
          must_not_contain "apt remove -y topo" "$remove_output"
          # The deb leg's dpkg-query counterpart, in the shape errexit honours
          # wherever it sits in the script rather than only as the last line.
          if rpm -q topo >/dev/null 2>&1; then
            echo "topo package is still installed"
            exit 1
          fi

  release-distro-smoke:
    name: Release Smoke Test (${{ matrix.name }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian stable
            image: debian:stable
            package: deb
          - name: openSUSE Leap
            image: opensuse/leap:15.6
            package: rpm-zypper
          - name: Rocky Linux 9
            image: rockylinux:9
            package: rpm-dnf
    container: ${{ matrix.image }}
    steps:
      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages

      - name: Install, Verify, and Remove Package
        shell: bash
        run: |
          set -euo pipefail
          # Each leg ends by asserting the package is gone. As an `! cmd` that
          # only held because it was the last line of the script -- errexit
          # exempts a negated command, so anything appended below it would have
          # silently turned the check off (D16).
          refute_installed() {
            # The probe is silenced because on the happy path it is a "no packages
            # found" complaint, and the one line worth reading is the ::error::.
            if "$@" >/dev/null 2>&1; then
              echo "::error::topo package is still installed ($*)"
              exit 1
            fi
          }
          case "${{ matrix.package }}" in
            deb)
              apt-get update
              apt-get install -y ./dist/packages/topo_*_amd64.deb
              topo --version
              topo remove --yes
              refute_installed dpkg-query -W topo
              ;;
            rpm-zypper)
              zypper --non-interactive refresh
              zypper --non-interactive install python311 python311-pip
              python3.11 -m pip install packaging
              ln -sf /usr/bin/python3.11 /usr/local/bin/python3
              zypper --non-interactive install --allow-unsigned-rpm ./dist/packages/topo-*-1.x86_64.rpm
              topo --version
              topo remove --yes
              refute_installed rpm -q topo
              ;;
            rpm-dnf)
              dnf install -y python3.11 python3.11-pip
              python3.11 -m pip install packaging
              ln -sf /usr/bin/python3.11 /usr/local/bin/python3
              dnf install -y ./dist/packages/topo-*-1.x86_64.rpm
              topo --version
              topo remove --yes
              refute_installed rpm -q topo
              ;;
          esac

  release-arm64-smoke:
    name: Release Smoke Test (ARM64 via QEMU)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download ARM64 Core Artifact
        uses: actions/download-artifact@v4
        with:
          name: topo-core-aarch64
          path: artifacts

      - name: Enable ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Run ARM64 Core Smoke Test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/topo-core-aarch64
          docker run --rm --platform linux/arm64 \
            -v "$PWD/artifacts/topo-core-aarch64:/usr/local/bin/topo-core:ro" \
            alpine:3.22 /usr/local/bin/topo-core /tmp

  release:
    name: Attach Release Assets
    needs:
      - tag-kind
      - build
      - package
      - smoke-script-install
      - smoke-ubuntu
      - smoke-fedora
      - release-distro-smoke
      - release-arm64-smoke
    runs-on: ubuntu-latest
    # A prerelease tag skips package and the three smoke jobs that need it, and a
    # skipped dependency would skip this job too under the default `success()`.
    # !cancelled() lifts that, which means every other reason to stand down has to
    # be spelled out: without the failure and cancellation checks a red smoke test
    # would still publish, and a failed `build` reaches here as a *skipped*
    # package rather than a failed one, so the engine artifacts this job always
    # consumes get their own check.
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    env:
      PRERELEASE: ${{ needs.tag-kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Download x86_64 Core Artifact
        uses: actions/download-artifact@v4
        with:
          name: topo-core-x86_64
          path: artifacts/topo-core-x86_64

      - name: Download aarch64 Core Artifact
        uses: actions/download-artifact@v4
        with:
          name: topo-core-aarch64
          path: artifacts/topo-core-aarch64

      - name: Download Package Artifacts
        if: env.PRERELEASE != 'true'
        uses: actions/download-artifact@v4
        with:
          name: topo-linux-packages
          path: dist/packages

      - name: Verify Release Notes
        run: test -f "docs/releases/${{ github.ref_name }}.md"

      - name: Import GPG Release Key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is required to sign release assets."
            exit 1
          fi
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Stage Release Assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          cp artifacts/topo-core-x86_64/topo-core-x86_64 release-assets/
          cp artifacts/topo-core-aarch64/topo-core-aarch64 release-assets/
          if [ "$PRERELEASE" != true ]; then
            cp dist/packages/*.deb release-assets/
            cp dist/packages/*.rpm release-assets/
          fi
          cp install.sh release-assets/
          # Signed source archive: install.sh's no-git path verifies this instead
          # of piping GitHub's unsigned auto-generated tarball straight into tar.
          git archive --format=tar.gz --prefix="topo-src/" \
            -o release-assets/topo-src.tar.gz HEAD

      - name: Generate Release Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS
          # This list is also the existence gate for the release payload: sha256sum
          # fails on a missing file, and it runs before anything is published.
          assets=(
            topo-core-x86_64
            topo-core-aarch64
            install.sh
            topo-src.tar.gz
          )
          if [ "$PRERELEASE" != true ]; then
            assets+=(*.deb *.rpm)
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Sign Checksum Manifest
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PASSPHRASE}" ]; then
            echo "::error::GPG_PASSPHRASE secret is required to sign release assets."
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --armor --detach-sign release-assets/SHA256SUMS

      - name: Select Release Assets
        shell: bash
        run: |
          set -euo pipefail
          # The attach step needs one asset list per tag kind, and
          # fail_on_unmatched_files is a whole-list switch rather than a per-entry
          # one, so the list is assembled here instead of being written twice.
          # install.sh is deliberately absent: it is checksummed above so the copy
          # served from the default branch can be verified against a tag, but the
          # release itself has never carried it.
          {
            echo 'RELEASE_FILES<<EOF'
            printf '%s\n' \
              release-assets/topo-core-x86_64 \
              release-assets/topo-core-aarch64 \
              release-assets/topo-src.tar.gz \
              release-assets/SHA256SUMS \
              release-assets/SHA256SUMS.asc \
              assets/topo-release-public.asc
            if [ "$PRERELEASE" != true ]; then
              printf '%s\n' release-assets/*.deb release-assets/*.rpm
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Attach Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: ${{ env.RELEASE_FILES }}
          draft: false
          prerelease: ${{ needs.tag-kind.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
